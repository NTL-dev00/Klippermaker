# Ultimaker 2 Extended+ (UM2E+) running Klipper - PrusaSlicer profile.
#
# Load: File > Import > Import Config  (PrusaSlicer 2.6 and newer)
#       File > Load Config            (older versions)
# Headless: prusa-slicer --load presets/prusaslicer-um2.ini --export-gcode part.stl
#
# Needs the PRINT_START / PRINT_END macros from config/macros.cfg on the printer.
#
# MEASURED on the machine (docs/07-results.md):
#   bed 225 x 225 and height 305 (tape measure), retraction 5 mm at 45 mm/s,
#   nozzle 220 C, bed 60 C, acceleration 7000 mm/s^2, layer height 0.2 mm,
#   flow 1.0, filament 2.85 mm, line width 0.45 mm.
# EVERYTHING ELSE (perimeters, infill, fan curves, speeds, top/bottom layers)
# is a sane starting default, not a measurement. Change them freely.

# ---- machine -------------------------------------------------------------
bed_shape = 0x0,225x0,225x225,0x225
max_print_height = 305
nozzle_diameter = 0.4
filament_diameter = 2.85
gcode_flavor = klipper
use_relative_e_distances = 1
use_firmware_retraction = 0

# ---- retraction: measured (5.0 mm is enough; 5.0-7.0 all string-free) -----
retract_length = 5
retract_speed = 45
deretract_speed = 45
retract_lift = 0.4
retract_lift_above = 0
retract_lift_below = 0
retract_before_wipe = 70%
wipe = 1
retract_restart_extra = 0
retraction_minimum_travel = 2

# ---- quality: layer height and width measured, the rest is a default -----
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = grid
external_perimeter_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.45
first_layer_extrusion_width = 0.45
extrusion_width = 0.45

# ---- speeds: conservative defaults, not measured ------------------------
perimeter_speed = 40
external_perimeter_speed = 40
infill_speed = 50
solid_infill_speed = 50
top_solid_infill_speed = 40
travel_speed = 150
first_layer_speed = 20
bridge_speed = 25
small_perimeter_speed = 25

# ---- acceleration: 5000-7000 measured better than 500-1500 --------------
# With gcode_flavor = klipper these become "M204 S<value>" lines.
# Never let a profile write "M204 P1500 T1500": Klipper obeys it and pins
# acceleration to 1500, which is what causes corner bulges.
default_acceleration = 7000
perimeter_acceleration = 7000
infill_acceleration = 7000
external_perimeter_acceleration = 5000
first_layer_acceleration = 1000
travel_acceleration = 7000
machine_max_acceleration_x = 7000
machine_max_acceleration_y = 7000
machine_max_acceleration_z = 30
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 25
machine_max_feedrate_e = 120

# ---- temperature: 195-220 C looked identical; 220 is the safe middle ----
temperature = 220
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
max_volumetric_speed = 12

# ---- cooling: one radial fan, full speed from layer 2 -------------------
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 2
slowdown_below_layer_time = 5
min_print_speed = 10

# ---- travel and quality of life ----------------------------------------
avoid_crossing_perimeters = 1
seam_position = aligned
gcode_comments = 0
start_gcode = PRINT_START BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
end_gcode = PRINT_END
before_layer_gcode =
after_layer_gcode =
