# ---------------------------------------------------------------------------
# Ultimaker 2 Extended+ (UM2E+) on Klipper - annotated starting config
#
# Machine: 225 x 225 x 305 mm build volume, 0.4 mm nozzle, 2.85 mm filament,
#          ~700 mm Bowden tube, one radial part-cooling fan.
# Board:   Ultimaker UltiMainboard v2 (ATmega2560), A4988-class drivers.
# Host:    Raspberry Pi running Klipper + Moonraker, web UI Fluidd or Mainsail.
#
# HOW TO USE THIS FILE
#   1. Copy printer.cfg and macros.cfg into ~/printer_data/config/ on the Pi.
#   2. Read every line marked MACHINE-SPECIFIC. Those values were measured on
#      one specific printer. Re-measure them on yours before you print.
#   3. Save, then RESTART. Follow the check order in docs/02-config.md.
#
# PINS: based on the UltiMainboard v2 mapping in Klipper's
# config/generic-ultimaker-ultimainboard-v2.cfg. Three values deliberately differ
# from that example: [extruder] dir_pin, [stepper_z] rotation_distance, and the
# added [heater_fan] block. Treat this file as the source of truth for this machine.
# They are correct for this board and nothing else. Different board? Replace
# every pin with the one in your board's own Klipper example config.
#
# There is no [gcode_arcs] section here on purpose: with it off, any G2/G3 in
# a g-code file fails with `Unknown command:"G2"`. Keep arcs off in your
# slicer too.
# ---------------------------------------------------------------------------

[mcu]
# What: how Klipper reaches the printer board.
# The by-id name stays the same across reboots; /dev/ttyACM0 does not always.
serial: /dev/serial/by-id/usb-Ultimaker_BV__www.ultimaker.com__Ultimaker_2.0-if00
# Check on the Pi: ls /dev/serial/by-id/
# If Klipper says "Unable to open serial port", this path is wrong or the
# board has no Klipper firmware on it yet.

[printer]
# What: the high-level motion limits for the whole machine.
kinematics: cartesian
max_velocity: 300              # mm/s top speed the head may be asked to reach
max_accel: 7000                # mm/s2 - the biggest quality lever here
square_corner_velocity: 5      # mm/s allowed through a 90 deg corner
max_z_velocity: 25             # Z is a slow lead screw, keep it slow
max_z_accel: 30

[stepper_x]
step_pin: PA3
dir_pin: !PA1
enable_pin: !PA5
microsteps: 16
# MACHINE-SPECIFIC-ish: 2 mm belt pitch x 20 teeth = 40. Do not "measure and
# trim" X/Y by printing a part - calculate it from the belt and pulley instead.
rotation_distance: 40
endstop_pin: ^!PA0
# MACHINE-SPECIFIC: X homes to the left, so the endstop sits at 0.
position_endstop: 0
position_max: 225
homing_speed: 50

[stepper_y]
step_pin: PC5
dir_pin: PC4
enable_pin: !PC6
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PA4
# MACHINE-SPECIFIC: this machine homes Y toward the back, so the endstop is at
# the far end (225), not at 0.
position_endstop: 225
position_max: 225
homing_speed: 50

[stepper_z]
# The bed moves in Z; the nozzle does not.
step_pin: PC2
dir_pin: !PC1
enable_pin: !PC3
microsteps: 16
# 200 full steps x 16 microsteps / 200 steps per mm = 16.
rotation_distance: 16
endstop_pin: ^!PA7
# MACHINE-SPECIFIC: the coordinate Klipper records when the Z endstop triggers.
# This endstop sits at the far end of travel, so Z=0 is the nozzle touching the glass
# and Z counts UP as the bed moves away. Measured with a sheet of paper, not copied.
position_endstop: 313.400
position_max: 315              # mechanical limit; usable print height is 305
position_min: -3.0
homing_positive_dir: true      # homes in +Z, i.e. toward the endstop at 313.4
homing_speed: 20

[extruder]
step_pin: PL7
dir_pin: !PL6                  # flip the ! if the motor pulls filament out
enable_pin: !PC0
microsteps: 16
# MACHINE-SPECIFIC: measured by the extrude-100 mm-and-measure method.
# Original guess was 9.133264 (5.92 % under-extruded). Re-measure yours.
rotation_distance: 8.6227662
nozzle_diameter: 0.400
# 2.85 mm, not 1.75. Wrong value here silently ruins every print.
filament_diameter: 2.850
heater_pin: PE4
sensor_type: PT100 INA826
sensor_pin: PK0
min_temp: 0
max_temp: 275
# The Bowden tube is ~700 mm, so loading filament has to push that far.
max_extrude_only_distance: 800.0
# Weak lever on a long Bowden: 0.20-0.92 all look the same on this machine.
pressure_advance: 0.28
# MACHINE-SPECIFIC: no PID values in this file on purpose. Start with
# watermark, run PID_CALIBRATE HEATER=extruder TARGET=220, then SAVE_CONFIG -
# the measured PID values are appended at the bottom of this file.
control: watermark

[heater_bed]
heater_pin: PG5
sensor_type: PT100 INA826
sensor_pin: PK2
min_temp: 0
max_temp: 100
# MACHINE-SPECIFIC: same as the extruder - run PID_CALIBRATE HEATER=heater_bed
# TARGET=60 and SAVE_CONFIG to get your own values.
control: watermark

# CHECK THE FANS BEFORE YOUR FIRST PRINT. This machine has TWO: a radial part-cooling
# fan the slicer controls on PH4, and the hotend heatsink fan on PJ6 that Klipper runs
# whenever the nozzle is hot. A stock UM2E+ has only the heatsink fan, wired to PH4.
# If yours is stock: DELETE the [fan] block below and change [heater_fan] to pin: PH4.
# Otherwise M106 S0 at the start of every print stops the fan that keeps the PTFE alive.
[fan]
# Part-cooling fan. One radial fan on this machine, no second fan.
pin: PH4

[heater_fan hotend_fan]
# Hotend heatsink fan: spins whenever the nozzle is above 45 C. Without it the
# PTFE liner in the hotend cooks and jams.
pin: PJ6
max_power: 1.0
kick_start_time: 0.3
heater: extruder
heater_temp: 45
fan_speed: 1.0

# ---------------------------------------------------------------------------
# NO PROBE IS FITTED on this machine. Z height comes from the top endstop plus
# the paper test. The two blocks below are here only so you know what they look
# like if you add a probe later - they are commented out on purpose.
#
# [probe]
# pin: <YOUR_PROBE_PIN>        # signal pin, from your board's pinout
# x_offset: 0                  # nozzle-to-probe distance, measure it
# y_offset: 25
# z_offset: 2.0                # run PROBE_CALIBRATE, it replaces this number
# speed: 5
#
# [safe_z_home]
# # Homes Z at a chosen X/Y instead of wherever the head happens to be.
# home_xy_position: 112.5, 112.5   # centre of the 225 mm bed
# speed: 50
# z_hop: 10
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Stepper driver current, set through the board's digital potentiometers.
# MACHINE-SPECIFIC: these are the values this board runs at. Too high overheats
# the drivers; too low skips steps.
# ---------------------------------------------------------------------------
[output_pin _stepper_xy_current]
pin: PL5
pwm: True
scale: 2.000
cycle_time: .000030
hardware_pwm: True
value: 1.2

[output_pin _stepper_z_current]
pin: PL4
pwm: True
scale: 2.000
cycle_time: .000030
hardware_pwm: True
value: 1.200

[output_pin _stepper_e_current]
pin: PL3
pwm: True
scale: 2.000
cycle_time: .000030
hardware_pwm: True
value: 1.250

# ---------------------------------------------------------------------------
# Sections Moonraker and the web UI expect to exist. Leave them in.
# ---------------------------------------------------------------------------
[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[include macros.cfg]
# PRINT_START / PRINT_END live in macros.cfg, next to this file.

# After your first PID_CALIBRATE + SAVE_CONFIG, Klipper writes your own PID
# numbers below this line. Do not type anything down there - it must stay
# valid config, and Klipper rewrites the block on every SAVE_CONFIG.
#*# <---------------------- SAVE_CONFIG ---------------------->
#*# DO NOT EDIT THIS BLOCK OR BELOW. The contents are auto-generated.
#*#
