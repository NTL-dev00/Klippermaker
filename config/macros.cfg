# ---------------------------------------------------------------------------
# macros.cfg - PRINT_START and PRINT_END for the Ultimaker 2 Extended+ (Klipper)
#
# THE ONE RULE THAT MATTERS MOST
# A parameter and its value must never be split by a line break. The slicer
# start-gcode field becomes real g-code lines, so this:
#
#     PRINT_START BED_TEMP=60
#     EXTRUDER_TEMP=220
#
# is TWO commands. Klipper runs PRINT_START with no nozzle temperature, then
# hits EXTRUDER_TEMP=220 and answers `Unknown command:"EXTRUDER_TEMP=220"`.
# That is only a WARNING - nothing turns red, nothing stops - so the print
# quietly runs at the macro's default temperature. This exact mistake made
# every part on this machine print at 190 C for weeks while the slicer said
# 220 C. Keep the call on ONE physical line:
#
#     PRINT_START BED_TEMP=60 EXTRUDER_TEMP=220
#
# In PrusaSlicer: start_gcode = PRINT_START BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
# In OrcaSlicer:  machine_start_gcode = PRINT_START BED_TEMP={bed_temperature_initial_layer_single} EXTRUDER_TEMP={nozzle_temperature_initial_layer}
# ---------------------------------------------------------------------------

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
    {% set PURGE_Y = params.PURGE_Y|default(20)|float %}

    G90                          ; absolute moves
    G92 E0                       ; extruder zero here

    M140 S{BED_TEMP}             ; bed on, do not wait for it yet
    M104 S150                    ; nozzle only to 150 C, so it does not ooze
                                 ; while the head is moving around

    G28 Z                        ; bed to the top switch first
    G1 Z50 F1200                 ; then to 50 mm: a big, safe gap either way
    G28 X Y                      ; now homing sideways cannot drag the nozzle
                                 ; across the glass

    M190 S{BED_TEMP}             ; wait for the bed
    M109 S{EXTRUDER_TEMP}        ; wait for the nozzle

    ; --- purge line -------------------------------------------------------
    ; Two lines at the front-left, well inside the bed clips. Bead is
    ; 0.3 mm high x 0.5 mm wide, so 150 mm of line needs ~3.5 mm of 2.85 mm
    ; filament: 150 * 0.3 * 0.5 / 6.38 = 3.5
    ; Check your bed clips before the first print: if one reaches Y={PURGE_Y}, raise PURGE_Y.
    G1 X15 Y{PURGE_Y} Z5 F6000   ; go to the purge spot, 5 mm clear
    G1 Z0.3 F600                 ; down to first-layer height
    G92 E0
    G1 X165 Y{PURGE_Y} E3.5 F900 ; first pass
    G1 X165 Y{PURGE_Y + 2.5} F3000
    G1 X15 Y{PURGE_Y + 2.5} E7.0 F900   ; second pass, primes the nozzle
    G92 E0
    G1 Z5 F3000                  ; lift clear before the real print starts

    ; Nothing above waits while the nozzle sits over a part - the two waits
    ; happen before any printing. If you add a wait or a pause mid-print,
    ; retract ~5 mm and park off the part first, or it leaves a blob.

[gcode_macro PRINT_END]
gcode:
    M140 S0                      ; bed heater off
    M104 S0                      ; nozzle heater off
    M106 S0                      ; part fan off

    G91                          ; relative moves from here
    G1 E-5 F2700                 ; retract 5 mm at 45 mm/s so it does not drip
    G1 Z+5 F600                  ; 5 mm further from the part, still inside
                                 ; the 315 mm of Z travel
    G90

    G1 X10 Y200 F6000            ; park at the back-left, out of the way
    M84                          ; motors off (the hotend fan keeps running
                                 ; until the nozzle drops below 45 C)

# ---------------------------------------------------------------------------
# Notes
#
# * The default EXTRUDER_TEMP is 220 C and the default BED_TEMP is 60 C for
#   PLA on this machine. Your slicer should always pass both explicitly, so
#   the defaults are only a safety net.
#
# * PAUSE / RESUME / CANCEL_PRINT are not defined here. If you run Mainsail,
#   add `[include mainsail.cfg]` to printer.cfg and it provides them - but set
#   its pause retract to ~5 mm. The stock 1 mm is a direct-drive value and does
#   nothing on a 700 mm Bowden tube.
#
# * Filament load/unload macros are deliberately not included. Pushing 700 mm
#   of filament through a Bowden is easy to get wrong (wrong direction, wrong
#   speed, wrong mode) and it is not needed to print. Use the web UI's extrude
#   and retract buttons with the hotend at 220 C.
# ---------------------------------------------------------------------------
